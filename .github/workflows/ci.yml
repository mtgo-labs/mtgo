name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # go1.26.8 crashes in the GC with cgo callback threads; 1.26.7 is the
    # last known-good patch. GOTOOLCHAIN=local forbids any float/download.
    # See issues/go1.26.8-gc-crash.md; lift after the upstream fix ships.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache-dependency-path: go.sum

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
